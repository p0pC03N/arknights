<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Friend Links Arcana</title>
  <link rel="stylesheet" href="./effects/arknights-cursor/cursor.css" />
  <style>
    :root {
      color-scheme: dark;
      --gold: #f4d59a;
      --ink: #f5f1eb;
      --muted: rgba(245, 241, 235, 0.66);
      --panel: rgba(10, 8, 18, 0.48);
      --panel-border: rgba(244, 213, 154, 0.18);
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.4);
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 18%, rgba(89, 61, 144, 0.18), transparent 24%),
        radial-gradient(circle at 78% 24%, rgba(244, 213, 154, 0.07), transparent 24%),
        radial-gradient(circle at 50% 76%, rgba(143, 169, 255, 0.05), transparent 28%),
        linear-gradient(180deg, #09060f, #020204 76%);
      color: var(--ink);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.18) 0 0.05rem, transparent 0.11rem),
        radial-gradient(circle at 34% 12%, rgba(255,255,255,0.12) 0 0.05rem, transparent 0.11rem),
        radial-gradient(circle at 63% 16%, rgba(255,255,255,0.16) 0 0.05rem, transparent 0.11rem),
        radial-gradient(circle at 86% 24%, rgba(255,255,255,0.12) 0 0.06rem, transparent 0.11rem);
      opacity: 0.42;
    }

    body::after {
      background:
        radial-gradient(circle at center, transparent 0 56%, rgba(0, 0, 0, 0.56) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.18), transparent 20%, transparent 80%, rgba(0, 0, 0, 0.34));
    }

    button {
      border: 0;
      font: inherit;
      color: inherit;
      background: none;
      cursor: pointer;
    }

    #scene-root {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      top: clamp(0.9rem, 2vw, 1.5rem);
      left: clamp(0.9rem, 2vw, 1.5rem);
      right: clamp(0.9rem, 2vw, 1.5rem);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .hud-group {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .pill,
    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 2.45rem;
      padding: 0.68rem 0.92rem;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .pill {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .hud-btn {
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .hud-btn:hover {
      transform: translateY(-0.06rem);
      border-color: rgba(244, 213, 154, 0.3);
      background: rgba(16, 13, 30, 0.6);
    }

    .status-dot {
      width: 0.56rem;
      height: 0.56rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.18);
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .status-dot.active {
      background: #9cf6d0;
      box-shadow: 0 0 1rem rgba(156, 246, 208, 0.6);
    }

    .whisper {
      position: absolute;
      left: 50%;
      bottom: clamp(0.9rem, 2vw, 1.3rem);
      transform: translateX(-50%);
      width: min(27rem, calc(100vw - 1.8rem));
      padding: 0.8rem 1rem;
      border: 1px solid var(--panel-border);
      background: rgba(8, 6, 16, 0.28);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .whisper-title {
      color: var(--gold);
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .whisper-text {
      margin-top: 0.32rem;
      font-size: 0.84rem;
      line-height: 1.55;
      color: var(--muted);
    }

    .nameplate {
      position: absolute;
      left: 50%;
      top: 15%;
      transform: translateX(-50%);
      width: min(22rem, calc(100vw - 2rem));
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .nameplate.is-visible {
      opacity: 1;
      visibility: visible;
    }

    .nameplate-kicker {
      color: var(--gold);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.68rem;
    }

    .nameplate-title {
      margin-top: 0.28rem;
      font-size: clamp(1.3rem, 3vw, 2rem);
      letter-spacing: 0.1em;
    }

    .nameplate-state {
      margin-top: 0.24rem;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    #video-box {
      position: absolute;
      right: clamp(0.9rem, 2vw, 1.5rem);
      top: clamp(4.5rem, 7vw, 6rem);
      width: min(11rem, 34vw);
      aspect-ratio: 4 / 3;
      border: 1px solid var(--panel-border);
      background: rgba(8, 6, 16, 0.24);
      backdrop-filter: blur(10px);
      overflow: hidden;
      opacity: 0;
      transform: translateY(-0.3rem);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    #video-box.is-visible {
      opacity: 0.72;
      transform: translateY(0);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(117, 90, 196, 0.18), transparent 34%),
        rgba(4, 3, 8, 0.94);
      transition: opacity 600ms ease, visibility 600ms ease;
    }

    #loading.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-card {
      width: min(24rem, calc(100vw - 2rem));
      padding: 1.6rem 1.5rem;
      border: 1px solid rgba(244, 213, 154, 0.22);
      background: rgba(11, 9, 22, 0.82);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .loading-kicker {
      color: var(--gold);
      font-size: 0.68rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .loading-title {
      margin-top: 0.8rem;
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      line-height: 1.2;
    }

    .loading-text {
      margin-top: 0.8rem;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.9rem;
    }

    @media (max-width: 720px) {
      .hud {
        gap: 0.55rem;
      }

      .pill,
      .hud-btn {
        min-height: 2.2rem;
        padding: 0.58rem 0.74rem;
        font-size: 0.68rem;
      }

      .whisper {
        width: calc(100vw - 1rem);
        bottom: 0.6rem;
      }

      #video-box {
        width: 8.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="scene-root"></div>

  <div id="ui-layer">
    <div class="hud">
      <div class="hud-group">
        <button id="btn-camera" class="hud-btn">Sense</button>
        <button id="btn-fullscreen" class="hud-btn">Fullscreen</button>
      </div>

      <div class="hud-group">
        <div class="pill"><span id="status-dot" class="status-dot"></span><span id="gesture-text">idle</span></div>
        <div class="pill"><span id="deck-state">LOADING</span></div>
      </div>
    </div>

    <div id="nameplate" class="nameplate">
      <div class="nameplate-kicker">Arcana</div>
      <div id="nameplate-title" class="nameplate-title">xiexie</div>
      <div id="nameplate-state" class="nameplate-state">ONLINE</div>
    </div>

    <div class="whisper">
      <div id="whisper-title" class="whisper-title">quiet signal</div>
      <div id="whisper-text" class="whisper-text">Touch the deck. The gate answers.</div>
    </div>

    <div id="video-box">
      <video id="webcam" autoplay muted playsinline></video>
    </div>
  </div>

  <div id="loading">
    <div class="loading-card">
      <div class="loading-kicker">Conjuring</div>
      <div class="loading-title">The hidden gate is waking.</div>
      <div class="loading-text">Stars, old backs, and unnamed visitors are returning to their places.</div>
    </div>
  </div>

  <script src="./friend-links-deck-assets.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js";

    const PLACEHOLDER_POOL = [
      { image: FRIEND_LINKS_DECK_ASSETS.lovers, accent: "#d7c0ff" },
      { image: FRIEND_LINKS_DECK_ASSETS.star, accent: "#ffe09d" },
      { image: FRIEND_LINKS_DECK_ASSETS.moon, accent: "#b5c7ff" },
      { image: FRIEND_LINKS_DECK_ASSETS.sun, accent: "#f7d18d" },
      { image: FRIEND_LINKS_DECK_ASSETS.wheel, accent: "#c0f1d8" },
      { image: FRIEND_LINKS_DECK_ASSETS.strength, accent: "#f1c2ff" },
      { image: FRIEND_LINKS_DECK_ASSETS.magician, accent: "#ffc7df" },
      { image: FRIEND_LINKS_DECK_ASSETS.fool, accent: "#f6d8a9" },
    ];
    const PLACEHOLDER_STATES = ["SEALED", "DORMANT", "PENDING", "VEILED"];
    const LINKS = [
      { id: "xiexie", name: "xiexie", status: "ONLINE", url: "https://xiexie-qiuligao.github.io", image: FRIEND_LINKS_DECK_ASSETS.world, accent: "#ffc7df" },
      ...Array.from({ length: 20 }, (_, index) => {
        const card = PLACEHOLDER_POOL[index % PLACEHOLDER_POOL.length];
        const order = String(index + 2).padStart(2, "0");
        return {
          id: `slot-${order}`,
          name: `No.${order}`,
          status: PLACEHOLDER_STATES[index % PLACEHOLDER_STATES.length],
          url: "",
          image: card.image,
          accent: card.accent,
        };
      }),
    ];

    const BACK_IMAGE = FRIEND_LINKS_DECK_ASSETS.back;
    const STATES = Object.freeze({ LOADING: "LOADING", IDLE: "IDLE", GRABBING: "GRABBING", REVEALED: "REVEALED", DISSOLVING: "DISSOLVING" });
    const CONFIG = {
      spacing: 5.72,
      baseScale: 1.04,
      hoverScale: 1.13,
      revealScale: 1.36,
      revealDistance: 8.5,
      cursorDistance: 20,
      grabCursorDistance: 16,
      pullThreshold: 0.08,
      wheelScrollFactor: 0.0115,
      dragScrollFactor: 0.042,
      scrollSpring: 0.138,
      scrollDamping: 0.88,
      scrollMaxSpeed: 4.4,
      floatY: 0.11,
      floatZ: 0.06,
      swayZ: 0.024,
      swayX: 0.02,
    };

    const ui = {
      loading: document.getElementById("loading"),
      deckState: document.getElementById("deck-state"),
      whisperTitle: document.getElementById("whisper-title"),
      whisperText: document.getElementById("whisper-text"),
      gestureText: document.getElementById("gesture-text"),
      statusDot: document.getElementById("status-dot"),
      nameplate: document.getElementById("nameplate"),
      nameplateTitle: document.getElementById("nameplate-title"),
      nameplateState: document.getElementById("nameplate-state"),
      btnCamera: document.getElementById("btn-camera"),
      btnFullscreen: document.getElementById("btn-fullscreen"),
      webcam: document.getElementById("webcam"),
      videoBox: document.getElementById("video-box"),
    };

    let scene;
    let camera;
    let renderer;
    let raycaster;
    let deckGroup;
    let handCursor;
    let galaxySystem;
    let particles = null;
    let particleLife = 0;
    let cards = [];
    let appState = STATES.LOADING;
    let currentCard = null;
    let grabbedCard = null;
    let grabStartHandSize = 0;
    let isMediaPipeReady = false;
    let isHandReady = false;
    let cameraFeed = null;
    let pendingWindow = null;
    let deckScroll = 0;
    let deckScrollTarget = 0;
    let deckScrollVelocity = 0;
    let deckMaxScroll = 0;
    let dragPointerId = null;
    let dragStartX = 0;
    let dragStartScroll = 0;
    let isDraggingDeck = false;

    const mouse = new THREE.Vector2(0, 0);
    const targetMouse = new THREE.Vector2(0, 0);

    function setState(state) {
      appState = state;
      ui.deckState.textContent = state;
    }

    function setWhisper(title, text) {
      ui.whisperTitle.textContent = title;
      ui.whisperText.textContent = text;
    }

    function setGesture(text, active = false) {
      ui.gestureText.textContent = text;
      ui.statusDot.classList.toggle("active", active);
    }

    function createCircleTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, "rgba(255,255,255,1)");
      gradient.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    function textureFromSource(src) {
      const texture = new THREE.TextureLoader().load(src);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      if (renderer) texture.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }

    function createGalaxy() {
      const count = 5200;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const geometry = new THREE.BufferGeometry();
      const white = new THREE.Color(0xffffff);
      const gold = new THREE.Color(0xf4d59a);

      for (let index = 0; index < count; index += 1) {
        const radius = Math.random() * 52 + 3;
        const spin = radius * 0.15;
        const angle = Math.random() * Math.PI * 2 + spin;
        positions[index * 3] = Math.cos(angle) * radius + (Math.random() - 0.5) * 2.2;
        positions[index * 3 + 1] = (Math.random() - 0.5) * radius * 0.18;
        positions[index * 3 + 2] = Math.sin(angle) * radius - 10;

        const mixed = white.clone().lerp(gold, Math.random() * 0.2);
        colors[index * 3] = mixed.r;
        colors[index * 3 + 1] = mixed.g;
        colors[index * 3 + 2] = mixed.b;
      }

      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      galaxySystem = new THREE.Points(
        geometry,
        new THREE.PointsMaterial({
          size: 0.12,
          vertexColors: true,
          transparent: true,
          opacity: 0.92,
          sizeAttenuation: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          map: createCircleTexture(),
        })
      );
      scene.add(galaxySystem);
    }

    function updateDeckScrollBounds() {
      const totalWidth = (LINKS.length - 1) * CONFIG.spacing + 3.2;
      const viewHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * camera.position.z;
      const viewWidth = viewHeight * camera.aspect;
      deckMaxScroll = Math.max(0, (totalWidth - viewWidth * 0.76) * 0.5);
      deckScrollTarget = THREE.MathUtils.clamp(deckScrollTarget, -deckMaxScroll, deckMaxScroll);
      deckScroll = THREE.MathUtils.clamp(deckScroll, -deckMaxScroll, deckMaxScroll);
      deckScrollVelocity = THREE.MathUtils.clamp(deckScrollVelocity, -CONFIG.scrollMaxSpeed, CONFIG.scrollMaxSpeed);
    }

    function applyDeckScroll(delta) {
      if (appState !== STATES.IDLE) return;
      deckScrollTarget = THREE.MathUtils.clamp(deckScrollTarget + delta, -deckMaxScroll, deckMaxScroll);
      deckScrollVelocity = THREE.MathUtils.clamp(deckScrollVelocity + delta * 0.18, -CONFIG.scrollMaxSpeed, CONFIG.scrollMaxSpeed);
    }

    function buildCard(link, index, total) {
      const frontTexture = textureFromSource(link.image);
      const backTexture = textureFromSource(BACK_IMAGE);
      const accent = new THREE.Color(link.accent);
      const edgeMaterial = new THREE.MeshStandardMaterial({
        color: 0x18121d,
        emissive: accent.clone().multiplyScalar(0.12),
        roughness: 0.76,
        metalness: 0.22,
      });
      const frontMaterial = new THREE.MeshStandardMaterial({
        map: frontTexture,
        emissive: new THREE.Color(0xffffff),
        emissiveIntensity: 0.12,
        roughness: 0.3,
        metalness: 0.08,
      });
      const backMaterial = new THREE.MeshStandardMaterial({
        map: backTexture,
        emissive: accent.clone().multiplyScalar(0.04),
        emissiveIntensity: 0.18,
        roughness: 0.42,
        metalness: 0.14,
      });
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(2.95, 5.18, 0.12),
        [edgeMaterial, edgeMaterial, edgeMaterial, edgeMaterial, frontMaterial, backMaterial]
      );

      const normalized = total === 1 ? 0 : index / (total - 1);
      mesh.position.x = (index - (total - 1) / 2) * CONFIG.spacing;
      mesh.position.y = -0.72 + ((index % 2) * 0.05);
      mesh.position.z = -Math.abs(index - (total - 1) / 2) * 0.02;
      mesh.rotation.y = Math.PI;
      mesh.rotation.z = ((index % 3) - 1) * 0.028;
      mesh.scale.setScalar(CONFIG.baseScale);
      mesh.userData = {
        link,
        basePos: mesh.position.clone(),
        baseRotZ: mesh.rotation.z,
        floatPhase: index * 0.43,
        floatSpeed: 0.72 + (index % 5) * 0.08,
      };
      cards.push(mesh);
      deckGroup.add(mesh);
    }

    function initScene() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x06040a, 0.02);

      camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 1000);
      camera.position.z = 26;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.getElementById("scene-root").appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.86));

      const key = new THREE.DirectionalLight(0xffffff, 1.08);
      key.position.set(0, 10, 12);
      scene.add(key);

      const rim = new THREE.PointLight(0xffd5c9, 0.78, 36);
      rim.position.set(0, -2, 8);
      scene.add(rim);

      createGalaxy();

      deckGroup = new THREE.Group();
      scene.add(deckGroup);
      LINKS.forEach((link, index) => buildCard(link, index, LINKS.length));
      updateDeckScrollBounds();

      handCursor = new THREE.Mesh(
        new THREE.RingGeometry(0.32, 0.44, 32),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide })
      );
      handCursor.visible = false;
      scene.add(handCursor);

      raycaster = new THREE.Raycaster();
      bindInput();
      addEventListener("resize", onResize);

      setState(STATES.LOADING);
      setWhisper("quiet signal", "The deck is still listening.");
      setGesture("idle");
      animate();

      setTimeout(() => {
        ui.loading.classList.add("is-hidden");
        setState(STATES.IDLE);
        setWhisper("quiet signal", "Drag the void, or wheel across the spread.");
      }, 1400);
    }

    function getHoveredCard() {
      raycaster.setFromCamera(mouse, camera);
      return raycaster.intersectObjects(cards, false)[0]?.object ?? null;
    }

    function revealCard(card) {
      currentCard = card;
      grabbedCard = null;
      setState(STATES.REVEALED);
      ui.nameplateTitle.textContent = card.userData.link.name;
      ui.nameplateState.textContent = card.userData.link.url ? "click again to enter" : card.userData.link.status;
      ui.nameplate.classList.add("is-visible");
      setWhisper("veil parted", card.userData.link.url ? "One more touch, and the gate opens." : "This seat is still unnamed.");
    }

    function returnToDeck() {
      if (appState === STATES.DISSOLVING) return;
      currentCard = null;
      grabbedCard = null;
      ui.nameplate.classList.remove("is-visible");
      setState(STATES.IDLE);
      setWhisper("quiet signal", "Drag the void, or wheel across the spread.");
    }

    function spawnDissolve(card) {
      const count = 2200;
      const positions = new Float32Array(count * 3);
      const velocities = new Float32Array(count * 3);
      const center = new THREE.Vector3();
      card.getWorldPosition(center);

      for (let index = 0; index < count; index += 1) {
        positions[index * 3] = center.x + (Math.random() - 0.5) * 3.1;
        positions[index * 3 + 1] = center.y + (Math.random() - 0.5) * 4.8;
        positions[index * 3 + 2] = center.z + (Math.random() - 0.5) * 0.8;

        const speed = 0.08 + Math.random() * 0.18;
        velocities[index * 3] = (Math.random() - 0.5) * speed;
        velocities[index * 3 + 1] = (Math.random() - 0.5) * speed;
        velocities[index * 3 + 2] = (Math.random() - 0.5) * speed;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("velocity", new THREE.BufferAttribute(velocities, 3));
      particles = new THREE.Points(
        geometry,
        new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.09,
          map: createCircleTexture(),
          transparent: true,
          opacity: 0.86,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      particleLife = 1;
      scene.add(particles);
    }

    function openCurrentCard() {
      if (!currentCard || appState === STATES.DISSOLVING) return;
      if (!currentCard.userData.link.url) {
        setWhisper("seal remains", "No true name has been written here yet.");
        return;
      }

      try {
        pendingWindow = window.open("about:blank", "_blank", "noopener");
      } catch {
        pendingWindow = null;
      }

      setState(STATES.DISSOLVING);
      setWhisper("gate opening", "Silver dust drifts. The door has chosen a side.");
      spawnDissolve(currentCard);
      currentCard.visible = false;

      setTimeout(() => {
        const url = currentCard.userData.link.url;
        if (pendingWindow && !pendingWindow.closed) pendingWindow.location.href = url;
        else if (window.top && window.top !== window) window.top.location.href = url;
        else window.location.href = url;
      }, 760);
    }

    function updateMouse(event) {
      if (!renderer) return;
      const rect = renderer.domElement.getBoundingClientRect();
      targetMouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      targetMouse.y = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
    }

    function onPointerDown(event) {
      updateMouse(event);
      dragPointerId = event.pointerId;
      dragStartX = event.clientX;
      dragStartScroll = deckScrollTarget;
      isDraggingDeck = false;
    }

    function onPointerMove(event) {
      updateMouse(event);
      if (dragPointerId !== event.pointerId || currentCard || appState !== STATES.IDLE) return;
      const deltaX = event.clientX - dragStartX;
      if (!isDraggingDeck && Math.abs(deltaX) > 6) isDraggingDeck = true;
      if (!isDraggingDeck) return;
      const nextScroll = THREE.MathUtils.clamp(dragStartScroll - deltaX * CONFIG.dragScrollFactor, -deckMaxScroll, deckMaxScroll);
      deckScrollVelocity = THREE.MathUtils.clamp((nextScroll - deckScrollTarget) * 0.55, -CONFIG.scrollMaxSpeed, CONFIG.scrollMaxSpeed);
      deckScrollTarget = nextScroll;
    }

    function onPointerUp(event) {
      updateMouse(event);
      const hovered = getHoveredCard();
      const dragged = dragPointerId === event.pointerId && isDraggingDeck;

      if (dragPointerId === event.pointerId) {
        dragPointerId = null;
        isDraggingDeck = false;
      }

      if (dragged) return;

      if (currentCard) {
        if (hovered === currentCard) openCurrentCard();
        else returnToDeck();
        return;
      }

      if (hovered) revealCard(hovered);
    }

    function bindInput() {
      addEventListener("pointermove", onPointerMove);
      addEventListener("pointerdown", onPointerDown);
      addEventListener("pointerup", onPointerUp);
      addEventListener("pointercancel", () => {
        dragPointerId = null;
        isDraggingDeck = false;
      });
      addEventListener("wheel", (event) => {
        if (currentCard) return;
        event.preventDefault();
        applyDeckScroll((event.deltaX + event.deltaY) * CONFIG.wheelScrollFactor);
      }, { passive: false });
      addEventListener("keydown", (event) => {
        if (event.key === "Escape") returnToDeck();
      });

      ui.btnFullscreen.addEventListener("click", async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      });

      ui.btnCamera.addEventListener("click", async () => {
        if (isMediaPipeReady) {
          stopGestureMode();
          return;
        }
        await startGestureMode();
      });
    }

    function stopGestureMode() {
      isMediaPipeReady = false;
      isHandReady = false;
      setGesture("idle");
      ui.videoBox.classList.remove("is-visible");
      ui.btnCamera.textContent = "Sense";
      handCursor.visible = false;

      if (cameraFeed) {
        cameraFeed.stop();
        cameraFeed = null;
      }

      const stream = ui.webcam.srcObject;
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        ui.webcam.srcObject = null;
      }
    }

    async function startGestureMode() {
      if (!window.Hands || !window.Camera) {
        setGesture("unavailable");
        return;
      }

      const hands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.55,
      });

      hands.onResults(onHandsResults);

      cameraFeed = new window.Camera(ui.webcam, {
        onFrame: async () => {
          await hands.send({ image: ui.webcam });
        },
        width: 640,
        height: 480,
      });

      await cameraFeed.start();
      isMediaPipeReady = true;
      ui.videoBox.classList.add("is-visible");
      ui.btnCamera.textContent = "Silence";
      setGesture("sensing", true);
    }

    function onHandsResults(results) {
      const landmarks = results.multiHandLandmarks?.[0];
      if (!landmarks) {
        isHandReady = false;
        grabbedCard = null;
        setGesture(isMediaPipeReady ? "searching" : "idle", isMediaPipeReady);
        handCursor.visible = false;
        if (appState === STATES.GRABBING) setState(STATES.IDLE);
        return;
      }

      isHandReady = true;
      setGesture("tracking", true);
      handCursor.visible = true;

      const pointerLandmark = landmarks[8];
      const thumbLandmark = landmarks[4];
      const indexBase = landmarks[5];
      const handSize = Math.hypot(pointerLandmark.x - indexBase.x, pointerLandmark.y - indexBase.y);
      const pinch = Math.hypot(pointerLandmark.x - thumbLandmark.x, pointerLandmark.y - thumbLandmark.y);
      const isPinching = pinch < handSize * 0.58;

      mouse.x = (pointerLandmark.x * 2) - 1;
      mouse.y = -((pointerLandmark.y * 2) - 1);

      raycaster.setFromCamera(mouse, camera);
      const planePoint = new THREE.Vector3(mouse.x * 8, mouse.y * 5.2, isPinching ? CONFIG.grabCursorDistance : CONFIG.cursorDistance);
      handCursor.position.lerp(planePoint, 0.26);

      const hovered = getHoveredCard();
      if (!isPinching) {
        grabbedCard = null;
        if (appState === STATES.GRABBING) setState(currentCard ? STATES.REVEALED : STATES.IDLE);
        return;
      }

      if (!currentCard && hovered && !grabbedCard) {
        grabbedCard = hovered;
        grabStartHandSize = handSize;
        setState(STATES.GRABBING);
      }

      if (grabbedCard && handSize - grabStartHandSize > CONFIG.pullThreshold) revealCard(grabbedCard);
      if (currentCard && hovered === currentCard && appState === STATES.REVEALED && handSize - grabStartHandSize > CONFIG.pullThreshold * 1.15) openCurrentCard();
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      updateDeckScrollBounds();
    }

    function animateParticles() {
      if (!particles) return;
      const positions = particles.geometry.attributes.position;
      const velocities = particles.geometry.attributes.velocity;
      for (let index = 0; index < positions.count; index += 1) {
        positions.setXYZ(
          index,
          positions.getX(index) + velocities.getX(index),
          positions.getY(index) + velocities.getY(index),
          positions.getZ(index) + velocities.getZ(index)
        );
      }
      positions.needsUpdate = true;
      particleLife -= 0.02;
      particles.material.opacity = Math.max(0, particleLife) * 0.86;
      if (particleLife <= 0) {
        scene.remove(particles);
        particles.geometry.dispose();
        particles.material.dispose();
        particles = null;
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      mouse.lerp(targetMouse, 0.18);
      const time = performance.now() * 0.001;

      if (galaxySystem) {
        galaxySystem.rotation.y += 0.00055;
        galaxySystem.rotation.z += 0.00012;
      }

      const hovered = appState === STATES.IDLE ? getHoveredCard() : null;

      cards.forEach((card) => {
        const { basePos, baseRotZ, floatPhase, floatSpeed } = card.userData;
        const targetPos = basePos.clone();
        const targetRotY = Math.PI;
        let targetRotZ = baseRotZ;
        let targetRotX = 0;
        let targetScale = CONFIG.baseScale;

        if (appState === STATES.IDLE) {
          targetPos.y += Math.sin(time * floatSpeed + floatPhase) * CONFIG.floatY;
          targetPos.z += Math.cos(time * (floatSpeed * 0.85) + floatPhase) * CONFIG.floatZ;
          targetRotZ += Math.sin(time * (floatSpeed * 0.7) + floatPhase) * CONFIG.swayZ;
          targetRotX += Math.cos(time * (floatSpeed * 0.55) + floatPhase) * CONFIG.swayX;
        }

        if (appState === STATES.IDLE && hovered === card) {
          targetPos.z += 0.86;
          targetPos.y += 0.14;
          targetScale = CONFIG.hoverScale;
          targetRotX *= 0.35;
        }

        if (currentCard === card) {
          targetPos.set(0, 0.14, CONFIG.revealDistance);
          targetScale = CONFIG.revealScale;
          card.rotation.x = THREE.MathUtils.lerp(card.rotation.x, 0, 0.12);
          card.rotation.y = THREE.MathUtils.lerp(card.rotation.y, 0, 0.12);
          card.rotation.z = THREE.MathUtils.lerp(card.rotation.z, 0, 0.12);
        } else {
          card.rotation.x = THREE.MathUtils.lerp(card.rotation.x, targetRotX, 0.12);
          card.rotation.y = THREE.MathUtils.lerp(card.rotation.y, targetRotY, 0.12);
          card.rotation.z = THREE.MathUtils.lerp(card.rotation.z, targetRotZ, 0.12);
        }

        card.position.lerp(targetPos, 0.12);
        card.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.12);

        if (!card.visible && appState !== STATES.DISSOLVING) card.visible = true;
      });

      if (appState === STATES.IDLE) {
        deckScrollVelocity += (deckScrollTarget - deckScroll) * CONFIG.scrollSpring;
        deckScrollVelocity *= CONFIG.scrollDamping;
        deckScrollVelocity = THREE.MathUtils.clamp(deckScrollVelocity, -CONFIG.scrollMaxSpeed, CONFIG.scrollMaxSpeed);
        deckScroll += deckScrollVelocity;

        if (deckScroll < -deckMaxScroll || deckScroll > deckMaxScroll) {
          deckScroll = THREE.MathUtils.clamp(deckScroll, -deckMaxScroll, deckMaxScroll);
          deckScrollVelocity *= 0.55;
          deckScrollTarget = THREE.MathUtils.clamp(deckScrollTarget, -deckMaxScroll, deckMaxScroll);
        }

        deckGroup.position.x = THREE.MathUtils.lerp(deckGroup.position.x, deckScroll, 0.16);
        deckGroup.rotation.y = THREE.MathUtils.lerp(deckGroup.rotation.y, mouse.x * 0.028, 0.05);
      } else {
        deckGroup.position.x = THREE.MathUtils.lerp(deckGroup.position.x, 0, 0.08);
        deckGroup.rotation.y = THREE.MathUtils.lerp(deckGroup.rotation.y, 0, 0.08);
      }

      animateParticles();
      renderer.render(scene, camera);
    }

    initScene();
  </script>
  <script src="./effects/arknights-cursor/cursor.js" defer></script>
</body>
</html>
